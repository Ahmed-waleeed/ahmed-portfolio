
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table</title>
</head>
<body>

    <h1>Student Information</h1>

    <table border="1">
        <tr>
            <th>Student ID</th>
            <th>Name</th>
            <th>Age</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Ahmed</td>
            <td>20</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Mohamed</td>
            <td>21</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Ali</td>
            <td>19</td>
        </tr>
    </table>

<h2>Click the Image to Visit Google</h2>

<a href="https://www.google.com" target="_blank">
    <img
        src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png"
        alt="Google Logo"
        width="200"
    >
</a>

</body>
</html>
