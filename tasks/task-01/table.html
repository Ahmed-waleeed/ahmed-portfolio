<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmed Waleed - Table</title>

    <link rel="icon" href="https://www.google.com/favicon.ico">

    <style>
        table {
            width: 420px;
            border: 2px solid black;
            padding: 5px;
            text-align: center;
        }

        td, th {
            border: 1px solid #999;
            padding: 12px;
        }

        .green {
            background-color: green;
            font-weight: bold;
        }

        .address {
            height: 55px;
        }

        .red {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <th colspan="2">Name</th>
            <th rowspan="2" class="address">Address</th>
        </tr>

        <tr>
            <td>Ahmed</td>
            <td>Waleed</td>
        </tr>

        <tr>
            <td colspan="3" class="green">
                All the data is here
            </td>
        </tr>

        <tr>
            <td colspan="2" rowspan="2">Ahmed Waleed</td>
            <td class="red">Port Said</td>
        </tr>

        <tr>
            <td>
                Egypt
            </td>
        </tr>
    </table>

    <br><br>

    <h2>Click the Image to Visit Google</h2>

    <a href="https://www.google.com" target="_blank">
        <img
            src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png"
            alt="Google Logo"
            width="200"
        >
    </a>

</body>
</html>
